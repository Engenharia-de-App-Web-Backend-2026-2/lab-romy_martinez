events {}

http {
    limit_req_zone $binary_remote_addr zone=limite_api:10m rate=1r/s;
    # Define o grupo de servidores back-end
    upstream meus_servidores {
        #ip_hash;
        #least_conn;
        server backend1:80; #weight=8;
        server backend2:80; #weight=1;
        server backend3:80; #weight=1;
    }

    server {
        # O Nginx vai escutar na porta 80
        listen 8080;

        location / {
            limit_req zone=limite_api;
            limit_req_status 503;   
            # Repassa a requisição para o grupo "meus_servidores"
            proxy_pass http://meus_servidores;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
        }
    }
}
